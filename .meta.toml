# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[pyproject]
codespell_skip = "*.css.map,*.map,*.min.js,pnpm-lock.yaml"

[pre_commit]
zpretty_extra_lines = """
        args: ['--extend-exclude', 'relatedimages_selection.xml']
"""

[gitignore]
extra_lines = """
robot_*
test_*
# constraints-mxdev.txt is committed: tox/CI install with it (use_mxdev)
!/constraints-mxdev.txt
/.mxdev_cache/
"""

[tox]
test_matrix = {"6.2" = ["3.13"]}
# tox installs with the committed constraints-mxdev.txt (generated by
# `mxdev -c mx.ini` from the Plone 6.2 constraints): the widget needs
# plone.staticresources >= 3.0.5, newer than the Plone 6.2.1 pin.
use_mxdev = true

[github]
jobs = [
   "qa",
   "release_ready",
   "circular",
]
